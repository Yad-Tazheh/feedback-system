<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <style>
    .popup-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .popup {
        position: relative;
        background: white;
        padding: 30px;
        width: 400px;
        max-width: 90%;
        border-radius: 10px;
        text-align: right;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .close-btn {
        position: absolute;
        top: 10px;
        left: 10px;
        border: none;
        background: none;
        font-size: 24px;
        cursor: pointer;
    }
</style>
    <meta charset="UTF-8">
    <title>درخواست‌ها</title>
</head>
<body>

<h1>درخواست‌ها، انتقادات و پیشنهادات</h1>

<a href="{% url 'request_create' %}">
    <button type="button">ثبت جدید</button>
</a>


<table border="1">
    <thead>
        <tr>
            <th>نوع</th>
            <th>عنوان</th>
            <th>متن</th>
            <th>تاریخ ثبت</th>
        </tr>
    </thead>

    <tbody>
        {% for item in requests %}
        <tr>
            <td>{{ item.get_type_display }}</td>
            <td>{{ item.title }}</td>
            <td>{{ item.text }}</td>
            <td>{{ item.created_at }}</td>
            <td>
                <a href="{% url 'request_update' item.pk %}">
                    ویرایش
                </a>

                <a href="{% url 'request_delete' item.pk %}">
                    حذف
                </a>

            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">هنوز موردی ثبت نشده است.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% if ai_response %}
<div id="aiPopup" class="popup-overlay">
    <div class="popup">
        <button class="close-btn" onclick="closePopup()">×</button>

        <h2>پاسخ سیستم</h2>

        <p>{{ ai_response }}</p>

        <button onclick="closePopup()">متوجه شدم</button>
    </div>
</div>

<script>
    function closePopup() {
        document.getElementById("aiPopup").style.display = "none";
    }
</script>
{% endif %}
</body>
</html>
